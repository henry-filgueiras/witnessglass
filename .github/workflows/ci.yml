name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install Scarp
        run: cargo install scarp --locked --version 0.2.0

      - name: Report tool versions
        run: |
          rustc --version
          cargo --version
          scarp --version

      - name: Run checks
        run: ./scripts/check.sh
